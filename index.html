<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>杜比影院排片</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.4.0/ical.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --card: #16161d;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --text: #e8e8ef;
      --text-dim: #8888a0;
      --border: #2a2a3a;
      --dolby: #00cec9;
      --dolby-bg: rgba(0, 206, 201, 0.08);
      --err: #ff6b6b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 { font-size: 18px; font-weight: 600; }
    .header h1 span { color: var(--dolby); }

    .header-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 16px 40px;
    }

    .day-block { margin-bottom: 28px; }

    .day-label {
      font-size: 20px;
      font-weight: 700;
      padding: 4px 0 14px;
    }

    .day-label .weekday {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
      margin-left: 6px;
    }

    .day-label .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      margin-left: 8px;
      vertical-align: middle;
    }

    .day-label .tag.today { background: var(--accent); color: white; }
    .day-label .tag.tomorrow { background: var(--accent-light); color: #1a1a2e; }

    .movie-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      padding: 16px;
    }

    .movie-name { font-size: 17px; font-weight: 600; margin-bottom: 12px; }

    .time-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    .time-chip {
      background: var(--dolby-bg);
      border: 1px solid rgba(0, 206, 201, 0.2);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      color: var(--dolby);
      font-variant-numeric: tabular-nums;
    }

    .state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .state.loading::after {
      content: "";
      display: block;
      width: 24px;
      height: 24px;
      margin: 16px auto 0;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state.error { color: var(--err); text-align: left; font-size: 13px; }
    .state.error pre { margin-top: 12px; white-space: pre-wrap; word-break: break-all; color: var(--text-dim); }

    .footer {
      text-align: center;
      padding: 20px;
      color: var(--text-dim);
      font-size: 12px;
    }

    @media (min-width: 641px) {
      .header { padding: 16px 24px; }
      .container { padding: 20px 24px 40px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1><span>杜比</span>排片</h1>
      <button class="header-btn" onclick="window.open('https://www.maoyan.com/cinema/24311','_blank')">猫眼购票</button>
    </div>
  </header>

  <main class="container" id="app">
    <div class="state loading">加载中</div>
  </main>

  <footer class="footer">西安万达影城 · 高新万达广场店</footer>

  <script>
    const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

    function showError(msg, detail) {
      document.getElementById('app').innerHTML =
        '<div class="state error">' + msg +
        (detail ? '<pre>' + detail + '</pre>' : '') + '</div>';
    }

    function render(list) {
      var app = document.getElementById('app');
      if (!list.length) {
        app.innerHTML = '<div class="state">暂无排片</div>';
        return;
      }

      var today = new Date();
      today.setHours(0, 0, 0, 0);

      var byDay = {};
      list.forEach(function(item) {
        var d = item.start;
        var key = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
        if (!byDay[key]) byDay[key] = { date: d, movies: {} };
        if (!byDay[key].movies[item.movie]) byDay[key].movies[item.movie] = [];
        byDay[key].movies[item.movie].push(d);
      });

      var html = '';
      Object.keys(byDay).sort(function(a,b){ return byDay[a].date - byDay[b].date; }).forEach(function(key) {
        var day = byDay[key];
        var d = day.date;
        var m = d.getMonth() + 1;
        var dd = d.getDate();
        var wd = WEEKDAYS[d.getDay()];
        var diff = Math.round((d - today) / 86400000);

        var tag = '';
        if (diff === 0) tag = '<span class="tag today">今天</span>';
        else if (diff === 1) tag = '<span class="tag tomorrow">明天</span>';

        html += '<div class="day-block">';
        html += '<div class="day-label">' + m + '月' + dd + '日<span class="weekday">' + wd + '</span>' + tag + '</div>';

        var movieNames = Object.keys(day.movies).sort(function(a,b){
          return day.movies[a][0] - day.movies[b][0];
        });
        movieNames.forEach(function(name) {
          var times = day.movies[name].sort(function(a,b){ return a - b; });
          html += '<div class="movie-block">';
          html += '<div class="movie-name">' + name + '</div>';
          html += '<div class="time-grid">';
          times.forEach(function(t) {
            var hh = String(t.getHours()).padStart(2, '0');
            var mm = String(t.getMinutes()).padStart(2, '0');
            html += '<div class="time-chip">' + hh + ':' + mm + '</div>';
          });
          html += '</div></div>';
        });

        html += '</div>';
      });

      app.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', function() {
      fetch('movies.ics?t=' + Date.now())
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function(data) {
          try {
            var jcalData = ICAL.parse(data);
            var comp = new ICAL.Component(jcalData);
            var vevents = comp.getAllSubcomponents('vevent');

            var all = vevents.map(function(ve) {
              var e = new ICAL.Event(ve);
              var s = e.summary || '';
              var m = s.match(/^(.+?)（(.+)）$/);
              return {
                movie: m ? m[1] : s,
                start: e.startDate.toJSDate()
              };
            });

            all.sort(function(a, b) { return a.start - b.start; });
            render(all);
          } catch (err) {
            showError('ICS 解析失败', err.message + '\n\n原始数据前200字:\n' + data.substring(0, 200));
          }
        })
        .catch(function(err) {
          showError('加载失败: ' + err.message);
        });
    });
  </script>
</body>
</html>
