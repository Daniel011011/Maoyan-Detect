<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>杜比影院排片</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.4.0/ical.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --card: #16161d;
      --card-hover: #1e1e28;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --text: #e8e8ef;
      --text-dim: #8888a0;
      --border: #2a2a3a;
      --dolby: #00cec9;
      --dolby-dim: #00b8b320;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header h1 span {
      color: var(--dolby);
    }

    .header-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .header-btn:active { opacity: 0.7; }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 16px 40px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .loading::after {
      content: "";
      display: block;
      width: 24px;
      height: 24px;
      margin: 16px auto 0;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .day-section {
      margin-bottom: 24px;
    }

    .day-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 8px 0 12px;
      position: sticky;
      top: 57px;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 50;
    }

    .day-date {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .day-weekday {
      font-size: 14px;
      color: var(--text-dim);
      font-weight: 400;
    }

    .day-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .day-tag.today {
      background: var(--accent);
      color: white;
    }

    .day-tag.tomorrow {
      background: var(--accent-light);
      color: #1a1a2e;
    }

    .movie-card {
      background: var(--card);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: background 0.15s;
    }

    .movie-card:active {
      background: var(--card-hover);
    }

    .movie-info {
      padding: 14px 16px 10px;
    }

    .movie-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .movie-meta {
      font-size: 12px;
      color: var(--text-dim);
    }

    .showtimes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 14px;
    }

    .showtime {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--dolby-dim);
      border: 1px solid rgba(0, 206, 201, 0.2);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--dolby);
    }

    .showtime .time {
      font-variant-numeric: tabular-nums;
    }

    .showtime .hall {
      font-size: 11px;
      color: var(--text-dim);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: var(--text-dim);
      font-size: 12px;
    }

    .footer a {
      color: var(--accent-light);
      text-decoration: none;
    }

    @media (min-width: 641px) {
      .header { padding: 16px 24px; }
      .container { padding: 16px 24px 40px; }
      .header h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1><span>杜比</span>排片</h1>
      <button class="header-btn" onclick="window.open('https://www.maoyan.com/cinema/24311','_blank')">猫眼购票</button>
    </div>
  </header>

  <main class="container" id="app">
    <div class="loading">加载排片数据中</div>
  </main>

  <footer class="footer">
    数据来源：猫眼 · 西安万达影城 高新万达广场店
  </footer>

  <script>
    const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

    function isSameDay(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function getDayLabel(date, today) {
      const diff = Math.round((date - today) / 86400000);
      if (diff === 0) return { text: '今天', cls: 'today' };
      if (diff === 1) return { text: '明天', cls: 'tomorrow' };
      return null;
    }

    function formatDayHeader(date, today) {
      const m = date.getMonth() + 1;
      const d = date.getDate();
      const wd = WEEKDAYS[date.getDay()];
      const tag = getDayLabel(date, today);
      let html = `<span class="day-date">${m}月${d}日</span><span class="day-weekday">${wd}</span>`;
      if (tag) html += `<span class="day-tag ${tag.cls}">${tag.text}</span>`;
      return html;
    }

    function render(events) {
      const app = document.getElementById('app');

      if (!events.length) {
        app.innerHTML = `
          <div class="empty-state">
            <div class="icon">🎬</div>
            <p>暂无杜比影院排片信息<br>稍后再来看看吧</p>
          </div>`;
        return;
      }

      const today = new Date();
      today.setHours(0,0,0,0);

      const grouped = {};
      events.forEach(e => {
        const d = e.start;
        const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
        if (!grouped[key]) grouped[key] = { date: d, movies: {} };
        const movieKey = e.title;
        if (!grouped[key].movies[movieKey]) grouped[key].movies[movieKey] = [];
        grouped[key].movies[movieKey].push(e);
      });

      const sortedDays = Object.values(grouped).sort((a, b) => a.date - b.date);

      let html = '';
      sortedDays.forEach(day => {
        html += `<div class="day-section">`;
        html += `<div class="day-header">${formatDayHeader(day.date, today)}</div>`;

        const sortedMovies = Object.entries(day.movies).sort((a, b) => {
          return a[1][0].start - b[1][0].start;
        });

        sortedMovies.forEach(([title, showtimes]) => {
          showtimes.sort((a, b) => a.start - b.start);
          const hall = showtimes[0].hall || '';

          html += `<div class="movie-card">`;
          html += `<div class="movie-info">`;
          html += `<div class="movie-title">${title}</div>`;
          html += `<div class="movie-meta">${hall}</div>`;
          html += `</div>`;
          html += `<div class="showtimes">`;

          showtimes.forEach(s => {
            const hh = String(s.start.getHours()).padStart(2, '0');
            const mm = String(s.start.getMinutes()).padStart(2, '0');
            html += `<div class="showtime"><span class="time">${hh}:${mm}</span></div>`;
          });

          html += `</div></div>`;
        });

        html += `</div>`;
      });

      app.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', function() {
      fetch('movies.ics')
        .then(r => r.text())
        .then(data => {
          const jcalData = ICAL.parse(data);
          const comp = new ICAL.Component(jcalData);
          const vevents = comp.getAllSubcomponents('vevent');

          const events = vevents.map(vevent => {
            const e = new ICAL.Event(vevent);
            const summary = e.summary || '';
            const match = summary.match(/^(.+?)（(.+?)）$/);
            return {
              title: match ? match[1] : summary,
              hall: match ? match[2] : '',
              start: e.startDate.toJSDate(),
              end: e.endDate ? e.endDate.toJSDate() : e.startDate.toJSDate(),
            };
          });

          events.sort((a, b) => a.start - b.start);
          render(events);
        })
        .catch(() => {
          document.getElementById('app').innerHTML = `
            <div class="empty-state">
              <div class="icon">⚠️</div>
              <p>数据加载失败，请刷新重试</p>
            </div>`;
        });
    });
  </script>
</body>
</html>
