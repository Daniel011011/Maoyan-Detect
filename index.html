<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>西安双影院排片 · 杜比影院 / 激光 IMAX</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0a0f;--card:#16161d;--text:#e8e8ef;--dim:#aaaabd;--border:#30303e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    header,main,footer{max-width:1180px;margin:auto;padding:24px}header{padding-top:40px}h1{font-size:28px;margin:0 0 8px}p{margin:8px 0;color:var(--dim)}a{color:inherit;text-underline-offset:4px}
    .toolbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:20px}button,.buy{border:1px solid var(--border);border-radius:8px;background:#252533;color:var(--text);padding:8px 14px;cursor:pointer;font:inherit}.buy{display:inline-block;text-decoration:none;margin-top:12px}
    input{accent-color:#a29bfe}label{cursor:pointer}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-top:0}.cinema{min-width:0;border:1px solid var(--border);border-radius:16px;padding:22px;--accent:#00cec9}.cinema.imax{--accent:#eeb967}
    .format{font-size:12px;color:var(--accent);letter-spacing:1px}h2{font-size:20px;margin:8px 0}.meta{font-size:12px;color:var(--dim)}.day{margin-top:26px}h3{font-size:18px;margin:0 0 12px}.movie{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}h4{margin:0 0 12px;font-size:16px}.times{display:flex;flex-wrap:wrap;gap:8px}.slot{border:1px solid var(--border);border-radius:7px;padding:8px 12px}.time{font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums}.hall{font-size:11px;color:var(--dim);max-width:230px}.warning{color:#ffb6a4}.empty{padding:30px 0;color:var(--dim)}.focus{color:#eeb967;font-size:12px;margin-bottom:8px}footer{font-size:12px;color:var(--dim)}#status{min-height:24px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #a29bfe;outline-offset:4px}
    @media(max-width:760px){main{grid-template-columns:1fr}header,main,footer{padding-left:16px;padding-right:16px}h1{font-size:24px}.cinema{padding:18px}}
  </style>
</head>
<body>
  <header>
    <h1>西安双影院排片</h1>
    <p>高新万达 · 杜比影院 &nbsp; / &nbsp; 荟聚寰映 · 激光 IMAX</p>
    <div class="toolbar">
      <label><input type="checkbox" id="saturday"> 只看周六</label>
      <label><input type="checkbox" id="avengers"> 只看《复联4》</label>
      <button id="refresh" type="button">刷新排片</button>
      <a href="movies.ics">订阅 / 下载日历</a>
    </div>
    <p id="status" class="meta" role="status" aria-live="polite">正在加载排片…</p>
  </header>
  <main id="app" aria-label="两家影院排片"></main>
  <footer>全部时间均为北京时间。仅展示指定影厅；排片不代表仍有余票，请以猫眼购票页为准。后台计划每 30 分钟检测一次，网页每 5 分钟刷新已发布的数据。</footer>
  <script src="app.js" defer></script>
</body>
</html>
