<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>杜比影院排片</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.4.0/ical.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --card: #16161d;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --text: #e8e8ef;
      --text-dim: #8888a0;
      --border: #2a2a3a;
      --dolby: #00cec9;
      --dolby-bg: rgba(0, 206, 201, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header h1 span { color: var(--dolby); }

    .header-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 16px 40px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .loading::after {
      content: "";
      display: block;
      width: 24px;
      height: 24px;
      margin: 16px auto 0;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .day-block {
      margin-bottom: 28px;
    }

    .day-label {
      font-size: 20px;
      font-weight: 700;
      padding: 4px 0 14px;
      letter-spacing: -0.3px;
    }

    .day-label .weekday {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
      margin-left: 6px;
    }

    .day-label .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      margin-left: 8px;
      vertical-align: middle;
    }

    .day-label .tag.today { background: var(--accent); color: white; }
    .day-label .tag.tomorrow { background: var(--accent-light); color: #1a1a2e; }

    .movie-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      padding: 16px;
    }

    .movie-name {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .time-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .time-chip {
      background: var(--dolby-bg);
      border: 1px solid rgba(0, 206, 201, 0.2);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      color: var(--dolby);
      font-variant-numeric: tabular-nums;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
    }

    .empty .icon { font-size: 48px; margin-bottom: 16px; }

    .footer {
      text-align: center;
      padding: 20px;
      color: var(--text-dim);
      font-size: 12px;
    }

    @media (min-width: 641px) {
      .header { padding: 16px 24px; }
      .container { padding: 20px 24px 40px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1><span>杜比</span>排片</h1>
      <button class="header-btn" onclick="window.open('https://www.maoyan.com/cinema/24311','_blank')">猫眼购票</button>
    </div>
  </header>

  <main class="container" id="app">
    <div class="loading">加载中</div>
  </main>

  <footer class="footer">西安万达影城 · 高新万达广场店</footer>

  <script>
    const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

    document.addEventListener('DOMContentLoaded', function() {
      fetch('movies.ics?t=' + Date.now())
        .then(r => r.text())
        .then(data => {
          const jcalData = ICAL.parse(data);
          const comp = new ICAL.Component(jcalData);
          const vevents = comp.getAllSubcomponents('vevent');

          const all = vevents.map(ve => {
            const e = new ICAL.Event(ve);
            const s = e.summary || '';
            const m = s.match(/^(.+?)（(.+)）$/);
            const start = e.startDate.toJSDate();
            return {
              movie: m ? m[1] : s,
              start: start
            };
          });

          all.sort((a, b) => a.start - b.start);
          render(all);
        })
        .catch(() => {
          document.getElementById('app').innerHTML =
            '<div class="empty"><div class="icon">!</div><p>加载失败，刷新试试</p></div>';
        });
    });

    function render(list) {
      const app = document.getElementById('app');
      if (!list.length) {
        app.innerHTML = '<div class="empty"><div class="icon">-</div><p>暂无排片</p></div>';
        return;
      }

      const today = new Date(); today.setHours(0,0,0,0);

      const byDay = {};
      list.forEach(item => {
        const d = item.start;
        const key = d.toDateString();
        if (!byDay[key]) byDay[key] = { date: d, movies: {} };
        if (!byDay[key].movies[item.movie]) byDay[key].movies[item.movie] = [];
        byDay[key].movies[item.movie].push(d);
      });

      let html = '';
      Object.values(byDay).forEach(day => {
        const d = day.date;
        const m = d.getMonth() + 1;
        const dd = d.getDate();
        const wd = WEEKDAYS[d.getDay()];
        const diff = Math.round((d - today) / 86400000);

        let tag = '';
        if (diff === 0) tag = '<span class="tag today">今天</span>';
        else if (diff === 1) tag = '<span class="tag tomorrow">明天</span>';

        html += '<div class="day-block">';
        html += `<div class="day-label">${m}月${dd}日<span class="weekday">${wd}</span>${tag}</div>`;

        Object.entries(day.movies).forEach(([name, times]) => {
          times.sort((a, b) => a - b);
          html += '<div class="movie-block">';
          html += `<div class="movie-name">${name}</div>`;
          html += '<div class="time-grid">';
          times.forEach(t => {
            const hh = String(t.getHours()).padStart(2, '0');
            const mm = String(t.getMinutes()).padStart(2, '0');
            html += `<div class="time-chip">${hh}:${mm}</div>`;
          });
          html += '</div></div>';
        });

        html += '</div>';
      });

      app.innerHTML = html;
    }
  </script>
</body>
</html>
